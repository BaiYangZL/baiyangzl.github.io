<!doctype html><meta charset="utf-8"><title>正在更新游戏</title><body style="background:#171019;color:#f2ddba;font:18px system-ui;padding:10vh 10vw">正在更新游戏资源，角色和位置会保留。<p id="status"></p><script>
(async()=>{const q=new URLSearchParams(location.search),version=q.get('v'),back=new URL(q.get('back')||'/',location.origin);if(!/^entry-load-[a-f0-9]{12}$/.test(version)||back.origin!==location.origin)throw Error('更新地址无效');const root=new URL('./',location.href),worker=new URL('arrival-sw.js?v='+version,root);if(q.get('step')!=='2'){for(const r of await navigator.serviceWorker.getRegistrations())if(r.scope===root.href&&new URL(r.active?.scriptURL||worker).pathname===worker.pathname)await r.unregister();q.set('step','2');location.replace(root.href+'cache-upgrade.html?'+q);return;}const r=await navigator.serviceWorker.register(worker.href,{scope:root.pathname});await navigator.serviceWorker.ready;sessionStorage.setItem('belvedere-upgraded-version',version);location.replace(back.href);})().catch(e=>{document.querySelector('#status').textContent='更新暂未完成：'+e.message+'。请刷新重试。';});
</script>
