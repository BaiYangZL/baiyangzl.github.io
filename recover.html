<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重新进入贝尔维德</title><style>body{background:#211b25;color:#f0dfbc;font:18px/1.8 system-ui;padding:12vh 8%;max-width:640px;margin:auto}a,button{color:#211b25;background:#efdab0;padding:14px 20px;border:0;border-radius:8px;font:inherit}</style><h1>重新进入贝尔维德</h1><p id="status">正在更新入口。你的角色和房间记录会保留。</p><p><a id="enter" href="./?v=entry-fix-20261027b" hidden>进入游戏</a></p><script>(async()=>{try{const base=new URL('./',location.href);if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())if(r.scope===base.href)await r.unregister();}if('caches' in window)for(const key of await caches.keys())if(key.startsWith('belvedere-'))await caches.delete(key);location.replace(new URL('./?v=entry-fix-20261027b',base));}catch(e){document.getElementById('status').textContent='自动更新未完成，请点击下方按钮重新进入。';document.getElementById('enter').hidden=false;}})();</script></html>
