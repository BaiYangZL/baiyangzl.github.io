<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>贝尔维德 · 角色选择</title><style>body{margin:0;background:#eeebe7;font-family:sans-serif}.result{max-width:900px;margin:auto;padding:30px;display:flex;gap:30px;align-items:center}.result img{max-height:85vh;max-width:60%;object-fit:contain}button{padding:12px 20px}</style><div id="result"></div><script type="module">

</script></html>
