<details id="entry-diagnostic" style="display:none;position:fixed;top:calc(35px + env(safe-area-inset-top));right:8px;z-index:2147483647;max-width:92vw;padding:10px;background:#f2e1bf;color:#302218;border:2px solid #a1773d;font:14px/1.4 system-ui">
<summary style="cursor:pointer">加载诊断 D2 · 点此复制</summary>
<p>无需等待家具加载。展开后复制以下内容发回；结果不会自动上传。</p>
<textarea id="entry-diagnostic-text" readonly style="width:80vw;max-width:560px;height:48vh">D2页面已到达，诊断脚本尚未执行。</textarea>
<p><button type="button" id="entry-diagnostic-copy">选中并复制</button></p>
</details>
<script id="entry-diagnostic-script">
(function(){
 var panel=document.getElementById('entry-diagnostic'),box=document.getElementById('entry-diagnostic-text'),errors=[],start=Date.now();
 var forced=new URLSearchParams(location.search).get('diagnose')==='1';if(!forced){panel.remove();return;}panel.style.display='block';
 function error(value){errors.push(String(value).slice(0,600));if(errors.length>15)errors.shift();}
 window.addEventListener('error',function(e){error(e.message||('资源失败: '+(e.target.src||e.target.href||'unknown')));},true);
 window.addEventListener('unhandledrejection',function(e){error(e.reason);});
 function collect(){
  var result={version:'entry-diagnostic-D2',url:location.href,elapsedMs:Date.now()-start,readyState:document.readyState,errors:errors.slice(),userAgent:navigator.userAgent,viewport:[innerWidth,innerHeight,devicePixelRatio]};
  try{result.controller=navigator.serviceWorker&&navigator.serviceWorker.controller?navigator.serviceWorker.controller.scriptURL:null;}catch(e){error(e);}
  try{result.entry=window.__tavernEntry?window.__tavernEntry.status():null;result.journey=window.__arrival?{phase:window.__arrival.state.phase,ready:window.__arrival.state.ready,error:window.__arrival.state.error}:null;
   var frame=document.querySelector('iframe[title="贝尔维德酒馆二楼"]'),child=frame?frame.contentWindow:window;
   result.iframe=frame?frame.src:null;result.childURL=child.location.href;result.childReady=child.document.readyState;
   result.boot=child.__tavernLoad?child.__tavernLoad.report():null;
   var state=child.__tavern?child.__tavern.state():null;result.scene=state?{ready:state.ready,firstFrameReady:state.firstFrameReady,room:state.floor,contextLost:state.contextLost,loadTimings:state.loadTimings}:null;
   var status=child.document.querySelector('#tavern-ui .status'),note=child.document.querySelector('#tavern-ui .note');result.status=status?status.textContent:null;result.note=note?note.textContent:null;
   result.resources=child.performance.getEntriesByType('resource').slice(-12).map(function(r){return {url:r.name,duration:Math.round(r.duration)};});
  }catch(e){result.readError=String(e);}
  return result;
 }
 function update(){var result=collect();if(!panel.open)box.value=JSON.stringify(result,null,2);if(!forced&&result.scene&&result.scene.firstFrameReady)panel.style.display='none';}
 panel.addEventListener('toggle',function(){if(panel.open)box.value=JSON.stringify(collect(),null,2);});
 document.getElementById('entry-diagnostic-copy').onclick=function(){box.focus();box.select();try{document.execCommand('copy');}catch(e){}};
 window.__entryDiagnostic=collect;update();setInterval(update,2000);
})();
</script>
