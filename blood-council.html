const selectOriginal=selectNominee;selectNominee=function(i){const previous=pair;selectOriginal(i);if(pair&&pair!==previous)playCue('point');};
const publicVote=document.createElement('div');publicVote.id='votePublicStatus';publicVote.setAttribute('aria-live','polite');publicVote.hidden=true;
function updatePublicVote(){if(publicVote.parentNode!==app)app.append(publicVote);const cb=clock.getBoundingClientRect(),ab=app.getBoundingClientRect();publicVote.style.left=(cb.left+cb.width/2-ab.left)+"px";publicVote.style.top=(cb.top+cb.width/2-ab.top)+"px";publicVote.hidden=phase!=='vote';clock.classList.toggle('voting-display',phase==='vote');if(phase!=='vote')return;const yes=[...votes.entries()].filter(([i,v])=>counted.has(i)&&v).length;publicVote.innerHTML=countdown?`<span>投票即将开始</span><strong class="countdown-digit">${countdownNumber}</strong>`:`<span><b class="nom-blue">${pair.from+1}号</b> 提名 <b class="nom-red">${pair.to+1}号</b></span><strong>${yes}<small> 票</small></strong><span>至少 ${needed()} 票 · 还差 ${Math.max(0,needed()-yes)}</span><span>${scan?'正在扫 '+(scan.order[scan.index]+1)+'号':scanDone?'计票完成':'等待举手'} · ${counted.size}/${players().length}</span>`;}

const deadSeats=new Set();let executionBusy=false,executionTimers=[],executionAudio=[];
const executeMenu=menu('executePlayer','宣布处决');
const executionDialog=dialog('executionDialog','宣布处决','<label>处决对象<select id="executionTarget"></select></label><p>先宣布处决对象，再播放你选择的结果；每段约 3 秒。</p><div class="trial-actions"><button id="executeSuccess">处决成功 · 死亡</button><button id="executeFailure">处决失败 · 存活</button></div><p class="trial-small">中文合成配音 · 本机演出。死亡仅作本地标记，不自动消耗死亡票。</p>');
const cinema=document.createElement('dialog');cinema.id='executionCinema';cinema.innerHTML='<div class="film-grain"></div><div class="film-bars"></div><div class="execution-scene"><div class="execution-halo"></div><svg class="execution-blade" viewBox="0 0 100 400"><path d="M48 20h4v28h24v10H54v260l-4 60-4-60V58H24V48h24Z" fill="url(#bladeMetal)"/><defs><linearGradient id="bladeMetal"><stop stop-color="#655b51"/><stop offset=".5" stop-color="#f1dfb8"/><stop offset="1" stop-color="#77716a"/></linearGradient></defs></svg><div class="execution-shield"></div><div class="execution-portrait"></div><div class="execution-number"></div></div><div class="execution-copy"><small>议会裁决</small><h1></h1><p></p></div><button class="execution-skip">跳过动画</button>';document.body.append(cinema);
function executionSound(file,voice=false){const a=new Audio(file+'.wav');a.volume=voice?1:.23;executionAudio.push(a);a.onloadedmetadata=()=>{if(voice)a.playbackRate=Math.max(1,a.duration/2.85)};a.play().catch(()=>{if(voice)toast('播报播放失败，字幕仍可查看');});}

function runExecution(i,success){if(!host()||executionBusy||!players().includes(i))return;executionBusy=true;executionDialog.close();timer.close();cancelScan();cinema.className='execution-announcement';const face=by('board').querySelectorAll('.seat')[i]?.querySelector('.face');cinema.querySelector('.execution-portrait').innerHTML=face?.innerHTML||'';cinema.querySelector('.execution-number').textContent=String(i+1).padStart(2,'0');cinema.querySelector('h1').textContent=`今天你们处决了 ${i+1} 号玩家`;cinema.querySelector('.execution-copy p').textContent=seatProfiles[i]?.name||'';cinema.showModal();executionSound('处决音效-宣布');executionSound(`处决播报-${i+1}-宣布`,true);

 executionTimers.push(setTimeout(()=>{executionAudio.forEach(a=>a.pause());executionAudio=[];cinema.className=success?'execution-death':'execution-failure';cinema.querySelector('h1').textContent=success?`${i+1} 号玩家被处决死亡`:'但是，处决失败了';cinema.querySelector('.execution-copy p').textContent=success?'烛火熄灭 · 席位归于寂静':'封印破裂 · 生命仍在';executionSound('处决音效-'+(success?'死亡':'失败'));executionSound(`处决播报-${i+1}-${success?'死亡':'失败'}`,true)},3000));executionTimers.push(setTimeout(finish,6000));}
executeMenu.onclick=()=>{if(!host()||executionBusy)return;hideMenu();options(by('executionTarget'),players().filter(i=>!deadSeats.has(i)));if(pending!==null)by('executionTarget').value=String(pending);executionDialog.showModal();};
by('executeSuccess').onclick=()=>runExecution(+by('executionTarget').value,true);by('executeFailure').onclick=()=>runExecution(+by('executionTarget').value,false);
const executionRender=render;render=function(){executionRender();executeMenu.disabled=!host()||executionBusy||!players().length;by('board').querySelectorAll('.seat').forEach((s,i)=>{s.classList.toggle('executed-dead',deadSeats.has(i));let badge=s.querySelector('.dead-ribbon');if(deadSeats.has(i)&&!badge){badge=document.createElement('span');badge.className='dead-ribbon';badge.textContent='死亡';s.append(badge)}else if(!deadSeats.has(i))badge?.remove();});};
const executionReset=by('resetCouncilGame').onclick;by('resetCouncilGame').onclick=()=>{if(!host())return;executionCleanup();deadSeats.clear();executionReset();};

const stateNames={pending:'待处决',dead:'死亡',ghost:'死亡带票'};
function statusArt(state){const symbol=state==='pending'?'<path d="M15 12h20v5H15zm10 5v10m0 0c-13 12-9 22 0 22s13-10 0-22Z" fill="none" stroke="#d9b779" stroke-width="3"/>':'<path d="M13 30c-7-20 31-20 24 0l-5 5v8H18v-8Z" fill="#e2dfd3"/><circle cx="19" cy="27" r="4" fill="#1c202b"/><circle cx="31" cy="27" r="4" fill="#1c202b"/><path d="m25 30-3 5h6Z" fill="#1c202b"/>';
return `<svg viewBox="0 0 50 65" aria-hidden="true"><path d="M7 2h36v60L25 51 7 62Z" fill="#141822" stroke="${state==='pending'?'#b8995e':'#8d8a9a'}" stroke-width="2"/><path d="M10 6h30M10 9h30" stroke="#77717b"/>${symbol}${state==='ghost'?'<circle cx="36" cy="46" r="9" fill="#5d5380" stroke="#d8c6a2"/><path d="m32 46 3 3 5-6" fill="none" stroke="#fff" stroke-width="2"/>':''}</svg>`;}
const perspective=document.createElement('div');perspective.className='test-perspective';perspective.innerHTML='<label>测试视角 <select id="testPerspective"><option value="host">说书人</option><option value="player">玩家</option></select></label><select id="testPlayer" aria-label="测试玩家"></select>';app.append(perspective);by('testPerspective').value=testingPerspective;
function changePerspective(){testingPerspective=by('testPerspective').value;document.querySelectorAll('dialog[open]').forEach(d=>{if(d!==cinema)d.close()});by('view').value=testingPerspective==='host'?'host':'public';by('view').dispatchEvent(new Event('change'));mount();}
by('testPerspective').onchange=changePerspective;by('testPlayer').onchange=()=>{testingPlayer=+by('testPlayer').value;render();};
const statusDialog=dialog('statusMarkDialog','设置状态标记','<p id="statusPlayerName"></p><div class="status-options"><button data-status="pending">待处决</button><button data-status="dead">死亡</button><button data-status="ghost">死亡带票</button><button data-status="">取消所有状态</button></div>');let statusPlayer=null;
for(const b of statusDialog.querySelectorAll('[data-status]')){if(b.dataset.status)b.insertAdjacentHTML('afterbegin',statusArt(b.dataset.status));b.onclick=()=>{if(!host()||scan||countdown)return;if(!players().includes(statusPlayer))return;setSeatState(statusPlayer,b.dataset.status);statusDialog.close();render();};}
function openStatus(i){if(!host())return;if(scan||countdown)return toast('扫针期间暂不能修改状态');statusPlayer=i;by('statusPlayerName').textContent=name(i);statusDialog.showModal();}
// Status badges remain clickable; an unmarked seat has a small status entry for the storyteller.
by('board').addEventListener('pointerdown',e=>{const b=e.target.closest('.seat-status');if(b)e.stopPropagation();},true);
const settle=document.createElement('button');settle.id='settleNomination';settle.className='settle-nomination';settle.textContent='结束本次提名并结算';settle.hidden=true;app.append(settle);
function closeNomination(){if(!host()||scan)return;const completed=scanDone;cancelScan();phase='free';pair=null;endAt=0;votes.clear();targeting=false;timer.close();render();toast(completed?'本次投票已保留，提名面板关闭':'已取消本次提名，不计入结果');}
settle.onclick=()=>{if(!host()||scan||countdown||executionBusy)return;if(pair&&!scanDone)return toast('请先完成投票，或在提名面板点击关闭取消');if(pending===null){closeNomination();return toast('没有待处决玩家，本次提名已结束');}options(by('executionTarget'),[pending]);executionDialog.showModal();};
const publicUpdateOriginal=updatePublicVote;updatePublicVote=function(){publicUpdateOriginal();const active=!!pair;publicVote.hidden=!active;clock.classList.toggle('voting-display',active);app.classList.toggle('nom-panel-active',active);if(!active)return;const yes=[...votes.entries()].filter(([i,v])=>counted.has(i)&&v).length;let detail=countdown?`<strong class="countdown-digit">${countdownNumber}</strong>`:phase==='vote'?`<strong>${yes}<small> 票</small></strong><span>至少 ${needed()} 票 · 还差 ${Math.max(0,needed()-yes)}</span><span>${scan?'正在扫 '+(scan.order[scan.index]+1)+'号':scanDone?'计票完成':'等待举手'} · ${counted.size}/${players().length}</span>`:`<strong>${format(seconds())}</strong><span>${phase==='nominator'?'提名人发言':'被提名人发言'}</span>`;
 let actions='';if(host()){actions=phase==='vote'?`<button data-nom-action="start" ${scan||scanDone||countdown?'disabled':''}>开始</button>`:'<button data-nom-action="endSpeech">结束发言</button>';actions+=`<button data-nom-action="close" ${scan?'disabled':''}>关闭</button>`;}else if(phase==='vote'){const locked=scanDone||counted.has(mySeat())||seatState(mySeat())==='dead';actions=`<button data-nom-action="raise" ${locked?'disabled':''}>举手</button><button data-nom-action="lower" ${locked?'disabled':''}>放手</button>`;}
 publicVote.innerHTML=`<span><b class="nom-blue">${pair.from+1}号</b> 提名 <b class="nom-red">${pair.to+1}号</b></span>${detail}${host()?`<button class="nom-timer-link" data-nom-action="timing">${phase==='vote'?by('scanInterval').value+'s':'计时控制'}</button>`:''}<div class="nom-inline-actions">${actions}</div>`;
};
publicVote.onclick=e=>{const action=e.target.closest('[data-nom-action]')?.dataset.nomAction;if(action==='timing'&&host()){render();timer.showModal();}if(action==='start'&&host())by('beginScan').click();if(action==='close')closeNomination();if(action==='endSpeech'&&host())nextPhase();if(action==='raise')toggleRaised(mySeat(),true);if(action==='lower')toggleRaised(mySeat(),false);};
const statusRenderOriginal=render;render=function(){statusRenderOriginal();bar.hidden=true;pendingLabel.hidden=true;by('finishVote').hidden=true;by('testPlayer').hidden=testingPerspective!=='player';const ids=players(),key=ids.join(',');if(by('testPlayer').dataset.roster!==key){options(by('testPlayer'),ids);by('testPlayer').dataset.roster=key;by('testPlayer').value=String(mySeat());}by('testPerspective').disabled=executionBusy;
 for(const id of ['enableNominations','sendGrimoire','executePlayer','manageSeats','chooseScript'])if(by(id))by(id).hidden=testingPerspective!=='host';
 settle.hidden=!host()||(!pair&&pending===null);settle.disabled=!!scan||!!countdown||executionBusy||!!pair&&!scanDone;
 const provisional=scan&&pair&&[...votes.entries()].filter(([i,v])=>counted.has(i)&&v).length>=needed()&&[...votes.entries()].filter(([i,v])=>counted.has(i)&&v).length>highest?pair.to:null;
 // Pending is unique and follows finalized tallies; transient previews never overwrite stored states.
 for(const [i,s]of seatStates)if(s==='pending'&&i!==pending)seatStates.delete(i);
 if(pending!==null&&!deadSeats.has(pending))seatStates.set(pending,'pending');
 by('board').querySelectorAll('.seat').forEach((s,i)=>{s.querySelector('.dead-ribbon')?.remove();if(!players().includes(i)){s.querySelector('.seat-status')?.remove();return;}const state=provisional!==null?(i===provisional?'pending':seatState(i)==='pending'?'':seatState(i)):seatState(i);let badge=s.querySelector('.seat-status');if(!badge){badge=document.createElement('button');badge.className='seat-status';badge.onclick=e=>{e.stopPropagation();openStatus(i)};s.append(badge);}badge.hidden=!state&&!host();badge.classList.toggle('status-empty',!state);badge.dataset.state=state;badge.innerHTML=state?statusArt(state):'◇';badge.title=stateNames[state]||'设置状态标记';badge.setAttribute('aria-label',`${i+1}号 设置状态标记${state?' · '+stateNames[state]:''}`);s.classList.toggle('executed-dead',state==='dead'||state==='ghost');});
};
const statusReset=by('resetCouncilGame').onclick;by('resetCouncilGame').onclick=()=>{if(!host())return;seatStates.clear();statusReset();};
const statusFinish=executionFinish;executionFinish=function(i,success){statusFinish(i,success);highest=0;render();};

new MutationObserver(mount).observe(by('board'),{childList:true});new MutationObserver(render).observe(by('hostSeat'),{attributes:true,attributeFilter:['class']});by('menu').addEventListener('click',render);document.addEventListener('visibilitychange',tick);function tick(){while(endAt&&seconds()===0){if(['nominator','nominee'].includes(phase))nextPhase(endAt);else{endAt=0;toast('讨论计时结束');}}render();}setInterval(tick,250);mount();
