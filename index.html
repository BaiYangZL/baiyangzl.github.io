<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#11141f"><title>血染钟楼 · 进场演示（非正式登录）</title><link rel="stylesheet" href="sample.css"><link rel="icon" href="data:,"></head>
<body><aside style="position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:10000;text-align:center;font:12px/1.5 sans-serif;color:#fff;background:#17202ddd;pointer-events:none">公开演示 · 非正式登录 · 演示密语 DEMO</aside><main id="game" aria-label="旅途与城门场景"></main><canvas id="map-layer" aria-hidden="true"></canvas><div id="veil" aria-hidden="true"></div>
<div id="companion" aria-hidden="true"><canvas id="mascot"></canvas></div>
<div id="boot" role="status"><div class="ink-mark">✧</div><p>展开旅途</p><button id="boot-retry" hidden onclick="location.reload()">重新打开</button></div>
<div id="notice" role="status" aria-live="polite" hidden><span id="message"></span><button id="retry" hidden>重试加载</button></div>
<div id="arrival" hidden><span>THE END OF THE OLD ROAD</span><h1>鸦木布拉夫</h1></div>
<section id="dialog" hidden aria-live="polite">
 <div id="speaker" aria-hidden="true"><div class="inner"><div class="cam"></div></div></div>
 <div id="dialog-box" tabindex="0" aria-label="对话，点击继续">
  <div class="nameplate">白羊</div>
  <p id="dialog-text"></p>
  <div id="dialog-choices"></div>
  <span id="dialog-next" hidden aria-hidden="true"></span>
 </div>
</section>
<section id="letter" hidden aria-label="邀请函">
 <div class="envelope" aria-hidden="true"><div class="back"></div><div class="flap"></div><div class="seal"><i></i><i></i></div></div>
 <div class="card">
  <p class="kicker">鸦木布拉夫 · 邀请函</p>
  <h2>致远道而来的旅人</h2>
  <p class="body">钟楼为你敲响了第一声。若你持有通行密语，请写在此处——城门只为持信之人打开。</p>
  <form id="letter-form" novalidate autocomplete="off">
   <label for="passcode">通行密语</label>
   <input id="passcode" name="passcode" type="text" maxlength="64" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="演示请输入 DEMO，不要填写个人密码">
   <p id="letter-status" role="status" aria-live="polite"></p>
   <div class="actions"><button type="button" id="letter-later">暂且收起</button><button type="submit" id="letter-submit">呈上密语</button></div>
  </form>
 </div>
</section>
<button id="letter-reopen" hidden>展开邀请函</button>
<div id="ending" hidden><p class="kicker">THE GATE IS OPEN</p><h2>城门已打开</h2><p>门后通往贝尔维德酒馆二楼。</p></div>
<footer><button id="replay" hidden>再走一程 ↻</button><label>画质 <select id="quality" aria-label="选择画质"><option value="low">流畅</option><option value="high">高清（推荐）</option><option value="ultra">极致</option></select></label><button id="pause" aria-pressed="false">暂停</button></footer>
<noscript>请启用浏览器 JavaScript 后查看旅途。</noscript>
<script>window.bootFailure=()=>{document.querySelector('#boot p').textContent='旅途未能加载，请检查网络后重试。';document.querySelector('#boot-retry').hidden=false;};window.bootTimer=setTimeout(window.bootFailure,15000);</script>
<script src="vendor/phaser.min.js" onerror="bootFailure()"></script><script type="module" src="sample.js?v=full-preload-20261024" onerror="bootFailure()"></script>
</body></html>
